<title>Sidelio Studio</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
:root{
  --bg:#eceef1; --panel:#ffffff; --panel-2:#f5f7f9; --panel-3:#eef1f4; --ink:#141a20; --muted:#5a6673; --faint:#8a95a1;
  --line:#e4e8ec; --line-2:#d3d9df; --brand:#6d4bf6; --brand-2:#8b6cf8; --brand-soft:#efeafe;
  --sel:#6d4bf6; --sel-soft:#ece7fd; --good:#2f8f5b; --good-soft:#e6f3ec;
  --shadow-sm:0 1px 2px rgba(20,26,32,.06); --shadow:0 2px 6px rgba(20,26,32,.06),0 8px 28px rgba(20,26,32,.09);
  --shadow-lg:0 12px 48px rgba(20,26,32,.18); --radius:14px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0a0c0f; --panel:#12161b; --panel-2:#171c22; --panel-3:#1d232a; --ink:#e9edf1; --muted:#95a1ad; --faint:#6b7783;
  --line:#242b33; --line-2:#323b44; --brand:#8f74ff; --brand-2:#a48bff; --brand-soft:#231d3a;
  --sel:#8f74ff; --sel-soft:#231d3a; --good:#4bbd82; --good-soft:#15251d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 2px 8px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
  --shadow-lg:0 16px 56px rgba(0,0,0,.6);
}}
:root[data-theme="dark"]{
  --bg:#0a0c0f; --panel:#12161b; --panel-2:#171c22; --panel-3:#1d232a; --ink:#e9edf1; --muted:#95a1ad; --faint:#6b7783;
  --line:#242b33; --line-2:#323b44; --brand:#8f74ff; --brand-2:#a48bff; --brand-soft:#231d3a;
  --sel:#8f74ff; --sel-soft:#231d3a; --good:#4bbd82; --good-soft:#15251d;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4); --shadow:0 2px 8px rgba(0,0,0,.4),0 10px 30px rgba(0,0,0,.4);
  --shadow-lg:0 16px 56px rgba(0,0,0,.6);
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased;overflow:hidden;}
button{font:inherit;cursor:pointer;color:inherit}
::selection{background:var(--sel-soft)}
.app{display:grid;grid-template-columns:60px 1fr 340px;grid-template-rows:54px 1fr;height:100vh;}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---- Top bar ---- */
.topbar{grid-column:1/-1;display:flex;align-items:center;gap:14px;padding:0 16px;background:var(--panel);border-bottom:1px solid var(--line);z-index:30;}
.logo{display:flex;align-items:center;gap:9px;font-weight:700;letter-spacing:-.01em;font-size:15px}
.logo .mark{width:28px;height:28px;border-radius:8px;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-weight:800;font-size:16px;box-shadow:0 2px 8px rgba(109,75,246,.35)}
.sitename{color:var(--muted);font-weight:500;font-size:13px;padding-left:12px;margin-left:2px;border-left:1px solid var(--line)}
.sitename b{color:var(--ink);font-weight:600}
.top-mid{margin:0 auto;display:flex;align-items:center;gap:2px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:3px;}
.top-mid button{border:0;background:transparent;color:var(--muted);padding:6px 11px;border-radius:7px;font-size:13px;display:flex;align-items:center;gap:6px;transition:.12s}
.top-mid button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}
.top-right{display:flex;align-items:center;gap:8px;}
.btn{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:9px;padding:8px 14px;font-size:13px;font-weight:500;display:inline-flex;align-items:center;gap:7px;transition:.12s}
.btn:hover{border-color:var(--muted)}
.btn:disabled{opacity:.38;cursor:default}
.btn-primary{background:linear-gradient(135deg,var(--brand),var(--brand-2));border:0;color:#fff;box-shadow:0 2px 10px rgba(109,75,246,.32)}
.btn-primary:hover{filter:brightness(1.06)}
.btn-icon{border-color:transparent;background:transparent;padding:8px;color:var(--muted);border-radius:8px}
.btn-icon:hover{background:var(--panel-2);color:var(--ink)}
.kbd{font:11px ui-monospace,monospace;background:var(--panel-3);border:1px solid var(--line);border-radius:5px;padding:1px 5px;color:var(--muted)}

/* ---- Left tool rail ---- */
.toolrail{background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding:12px 0;gap:4px;}
.toolrail button{width:40px;height:40px;border:0;background:transparent;color:var(--muted);border-radius:10px;display:grid;place-items:center;font-size:17px;transition:.12s;position:relative}
.toolrail button:hover{background:var(--panel-2);color:var(--ink)}
.toolrail button[aria-pressed="true"]{background:var(--brand-soft);color:var(--brand)}
.toolrail .sp{flex:1}
.tip{position:absolute;left:52px;top:50%;transform:translateY(-50%);background:var(--ink);color:var(--bg);font-size:12px;padding:5px 9px;border-radius:7px;white-space:nowrap;opacity:0;pointer-events:none;transition:.12s;z-index:40;box-shadow:var(--shadow)}
.toolrail button:hover .tip{opacity:1}

/* ---- Canvas stage ---- */
.stage{overflow:auto;padding:30px 30px 120px;display:flex;justify-content:center;align-items:flex-start;background:
  radial-gradient(circle at 1px 1px, var(--line) 1px, transparent 0) 0 0/24px 24px;position:relative;}
.frame{background:#fff;border-radius:16px;box-shadow:var(--shadow);width:100%;max-width:1000px;transition:max-width .3s cubic-bezier(.4,0,.2,1);overflow:hidden;position:relative}
.frame.tablet{max-width:740px}
.frame.mobile{max-width:400px}

/* selection + inline insert */
.sec{position:relative;outline:2px solid transparent;outline-offset:-2px;transition:outline-color .12s;}
.sec:hover{outline-color:var(--sel-soft)}
.sec.selected{outline-color:var(--sel)}
.sec.dragging{opacity:.4}
.sec.drop-before::before,.sec.drop-after::after{content:"";position:absolute;left:0;right:0;height:3px;background:var(--brand);z-index:8;border-radius:2px}
.sec.drop-before::before{top:-2px}.sec.drop-after::after{bottom:-2px}
.sec-bar{position:absolute;top:8px;right:8px;display:none;gap:2px;background:var(--sel);border-radius:9px;padding:3px;z-index:6;box-shadow:var(--shadow)}
.sec.selected>.sec-bar{display:flex}
.sec-bar button{border:0;background:transparent;color:#fff;width:28px;height:26px;border-radius:6px;display:grid;place-items:center;font-size:13px;opacity:.9}
.sec-bar button:hover{background:rgba(255,255,255,.2);opacity:1}
.sec-bar .grip{cursor:grab}
.sec-tag{position:absolute;top:8px;left:8px;display:none;background:var(--sel);color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.05em;text-transform:uppercase;padding:4px 9px;border-radius:8px;z-index:6}
.sec.selected>.sec-tag{display:block}
.insert{position:relative;height:0;z-index:7}
.insert button{position:absolute;left:50%;top:-15px;transform:translateX(-50%);width:30px;height:30px;border-radius:50%;border:0;background:var(--brand);color:#fff;font-size:18px;line-height:1;display:grid;place-items:center;opacity:0;transition:.14s;box-shadow:0 3px 10px rgba(109,75,246,.4)}
.insert:hover button,.insert.open button{opacity:1}
.insert::before{content:"";position:absolute;left:0;right:0;top:0;height:1px;background:var(--brand);opacity:0;transition:.14s}
.insert:hover::before{opacity:.5}
[data-edit]{outline:none;border-radius:4px}
[data-edit]:focus{box-shadow:0 0 0 2px var(--sel),0 0 0 5px var(--sel-soft)}
.sec-new{animation:pop .4s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop{from{opacity:0;transform:translateY(14px) scale(.98)}to{opacity:1;transform:none}}

/* ---- Right dock ---- */
.dock{background:var(--panel);border-left:1px solid var(--line);display:flex;flex-direction:column;min-height:0;}
.dock-tabs{display:flex;padding:10px 12px 0;gap:4px;border-bottom:1px solid var(--line)}
.dock-tabs button{flex:1;border:0;background:transparent;color:var(--muted);padding:9px;border-radius:9px 9px 0 0;font-size:13px;font-weight:500;display:flex;align-items:center;justify-content:center;gap:6px;border-bottom:2px solid transparent;margin-bottom:-1px}
.dock-tabs button[aria-pressed="true"]{color:var(--ink);border-bottom-color:var(--brand)}
.dock-body{flex:1;overflow-y:auto;min-height:0}

/* Assistant */
.chat{display:flex;flex-direction:column;height:100%}
.chat-log{flex:1;overflow-y:auto;padding:16px 14px;display:flex;flex-direction:column;gap:14px}
.msg{display:flex;gap:9px;font-size:13.5px;line-height:1.5;animation:fade .25s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
.msg .av{width:26px;height:26px;border-radius:8px;flex:none;display:grid;place-items:center;font-size:13px;font-weight:700}
.msg.ai .av{background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff}
.msg.me{flex-direction:row-reverse}
.msg.me .bubble{background:var(--brand-soft);border-radius:12px 12px 3px 12px;color:var(--ink)}
.msg.me .av{background:var(--panel-3);color:var(--muted)}
.bubble{background:var(--panel-2);border:1px solid var(--line);padding:9px 12px;border-radius:12px 12px 12px 3px;max-width:240px}
.bubble .did{margin-top:7px;padding-top:7px;border-top:1px solid var(--line);font-size:12px;color:var(--muted);display:flex;flex-direction:column;gap:3px}
.bubble .did span::before{content:"✓ ";color:var(--good);font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:2px}
.chip{border:1px solid var(--line-2);background:var(--panel);color:var(--ink);border-radius:20px;padding:6px 12px;font-size:12.5px;transition:.12s;display:inline-flex;align-items:center;gap:5px}
.chip:hover{border-color:var(--brand);color:var(--brand);background:var(--brand-soft)}
.typing{display:flex;gap:3px;padding:4px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.2s}.typing i:nth-child(3){animation-delay:.4s}
@keyframes blink{0%,60%,100%{opacity:.3}30%{opacity:1}}
.composer{border-top:1px solid var(--line);padding:12px;background:var(--panel)}
.composer .box{border:1.5px solid var(--line-2);background:var(--panel-2);border-radius:13px;padding:10px 12px;transition:.14s;display:flex;flex-direction:column;gap:8px}
.composer .box:focus-within{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.composer textarea{border:0;background:transparent;color:var(--ink);resize:none;font:inherit;font-size:13.5px;width:100%;outline:none;max-height:110px;line-height:1.45}
.composer .row{display:flex;align-items:center;justify-content:space-between}
.composer .hintlabel{font-size:11px;color:var(--faint);display:flex;align-items:center;gap:6px}
.send{width:32px;height:32px;border-radius:9px;border:0;background:linear-gradient(135deg,var(--brand),var(--brand-2));color:#fff;display:grid;place-items:center;font-size:15px;transition:.12s}
.send:hover{filter:brightness(1.08)}.send:disabled{opacity:.4}

/* Inspector / design */
.pane{padding:14px 15px;border-bottom:1px solid var(--line)}
.pane h3{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin:0 0 11px;font-weight:600;display:flex;justify-content:space-between;align-items:center}
.field{margin-bottom:11px}.field:last-child{margin-bottom:0}
.field label{display:block;font-size:12px;color:var(--muted);margin-bottom:4px}
.field input[type=text],.field textarea{width:100%;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);border-radius:8px;padding:8px 10px;font:inherit;font-size:13px}
.field textarea{resize:vertical;min-height:56px;line-height:1.45}
.field input:focus,.field textarea:focus{outline:none;border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft)}
.seg{display:flex;gap:3px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:3px}
.seg button{flex:1;border:0;background:transparent;color:var(--muted);padding:7px;border-radius:6px;font-size:12.5px}
.seg button[aria-pressed="true"]{background:var(--panel);color:var(--ink);box-shadow:var(--shadow-sm)}
.swatches{display:grid;grid-template-columns:repeat(7,1fr);gap:7px}
.swatches button{aspect-ratio:1;border-radius:8px;border:2px solid transparent}
.swatches button[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--panel),0 0 0 4px var(--ink)}
.design-grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}
.design-card{border:1px solid var(--line-2);border-radius:11px;overflow:hidden;text-align:left;background:var(--panel-2);padding:0;transition:.12s}
.design-card:hover{border-color:var(--brand)}
.design-card[aria-pressed="true"]{border-color:var(--brand);box-shadow:0 0 0 2px var(--brand-soft)}
.design-card .prev{height:42px;display:flex}
.design-card .prev i{flex:1}
.design-card .meta{padding:7px 9px}
.design-card .dn{font-size:12.5px;font-weight:600}
.design-card .dt{font-size:10.5px;color:var(--muted);margin-top:1px}
.items-editor .item{background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:10px;margin-bottom:7px;position:relative}
.items-editor .item .rm{position:absolute;top:7px;right:7px;border:0;background:transparent;color:var(--muted);font-size:14px;width:20px;height:20px;border-radius:5px}
.items-editor .item .rm:hover{background:var(--line);color:var(--ink)}
.add-item{width:100%;border:1px dashed var(--line-2);background:transparent;color:var(--muted);border-radius:9px;padding:9px;font-size:12.5px}
.add-item:hover{border-color:var(--brand);color:var(--brand)}
.emptyhint{padding:36px 20px;text-align:center;color:var(--muted);font-size:13px;line-height:1.6}
.emptyhint .big{font-size:28px;margin-bottom:8px}

/* Add-section menu */
.menu{position:fixed;background:var(--panel);border:1px solid var(--line-2);border-radius:12px;box-shadow:var(--shadow-lg);padding:6px;z-index:60;width:210px;max-height:320px;overflow:auto;animation:fade .12s}
.menu button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:8px 9px;border-radius:8px;font-size:13px}
.menu button:hover{background:var(--panel-2)}
.menu .ic{width:26px;height:26px;border-radius:7px;background:var(--panel-3);display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.menu .mt{font-size:10px;text-transform:uppercase;letter-spacing:.07em;color:var(--faint);padding:8px 9px 4px}

/* Onboarding */
.onb{position:fixed;inset:0;background:var(--bg);z-index:100;display:grid;place-items:center;padding:24px;transition:opacity .4s}
.onb.gone{opacity:0;pointer-events:none}
.onb-inner{max-width:600px;width:100%;text-align:center}
.onb .logo{justify-content:center;font-size:19px;margin-bottom:26px}
.onb .logo .mark{width:34px;height:34px;font-size:19px}
.onb h1{font-size:clamp(26px,4vw,40px);letter-spacing:-.03em;margin:0 0 12px;line-height:1.08}
.onb h1 .g{background:linear-gradient(120deg,var(--brand),var(--brand-2));-webkit-background-clip:text;background-clip:text;color:transparent}
.onb p{color:var(--muted);font-size:16px;margin:0 auto 30px;max-width:44ch}
.onb-box{border:1.5px solid var(--line-2);background:var(--panel);border-radius:16px;padding:14px 16px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;text-align:left;transition:.14s}
.onb-box:focus-within{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft),var(--shadow)}
.onb-box textarea{border:0;background:transparent;color:var(--ink);resize:none;font:inherit;font-size:16px;outline:none;min-height:52px;line-height:1.45}
.onb-box .r{display:flex;justify-content:space-between;align-items:center}
.onb-ex{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:22px}
.onb-ex .chip{background:var(--panel);font-size:13px}
.build-anim{display:flex;flex-direction:column;gap:10px;align-items:center;color:var(--muted);font-size:14px}
.build-anim .bar{width:220px;height:5px;border-radius:20px;background:var(--panel-3);overflow:hidden}
.build-anim .bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--brand),var(--brand-2));border-radius:20px;transition:width .3s}
.build-steps{font-size:13px;color:var(--muted);min-height:20px}

/* Command palette */
.cmdk{position:fixed;inset:0;background:rgba(10,12,15,.4);z-index:90;display:none;padding-top:14vh;justify-content:center;animation:fade .12s}
.cmdk.open{display:flex}
.cmdk-box{width:min(520px,92vw);background:var(--panel);border:1px solid var(--line-2);border-radius:14px;box-shadow:var(--shadow-lg);overflow:hidden;height:max-content}
.cmdk-box input{width:100%;border:0;border-bottom:1px solid var(--line);background:transparent;color:var(--ink);padding:15px 16px;font:inherit;font-size:15px;outline:none}
.cmdk-list{max-height:320px;overflow:auto;padding:6px}
.cmdk-list button{display:flex;align-items:center;gap:11px;width:100%;text-align:left;border:0;background:transparent;color:var(--ink);padding:9px 10px;border-radius:8px;font-size:13.5px}
.cmdk-list button.on,.cmdk-list button:hover{background:var(--panel-2)}
.cmdk-list .ic{width:26px;height:26px;border-radius:7px;background:var(--panel-3);display:grid;place-items:center;font-size:13px;color:var(--muted);flex:none}
.cmdk-list .sub{color:var(--faint);font-size:11.5px;margin-left:auto}

/* Toast */
.toast{position:fixed;bottom:24px;left:calc(50% - 170px);transform:translateX(-50%) translateY(20px);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:11px;font-size:13.5px;box-shadow:var(--shadow-lg);opacity:0;pointer-events:none;transition:.25s;display:flex;align-items:center;gap:9px;z-index:70}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.toast .ok{width:17px;height:17px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-size:11px}

@media (max-width:900px){.app{grid-template-columns:1fr}.toolrail,.dock{display:none}}
</style>

<!-- Onboarding -->
<div class="onb" id="onb">
  <div class="onb-inner" id="onb-inner">
    <div class="logo"><span class="mark">S</span> Sidelio Studio</div>
    <h1>Describe your business.<br><span class="g">Watch your site build itself.</span></h1>
    <p>Tell Sidelio what you do in a sentence. It drafts a complete, on-brand website you can shape by talking to it — or by clicking straight onto the page.</p>
    <div class="onb-box" id="onb-box">
      <textarea id="onb-input" placeholder="e.g. A family roofing company on Prince Edward Island…" rows="2"></textarea>
      <div class="r">
        <span class="hintlabel" style="font-size:12px;color:var(--faint)">✦ AI drafts copy, layout, and design</span>
        <button class="btn btn-primary" id="onb-go">Build my site →</button>
      </div>
    </div>
    <div class="onb-ex" id="onb-ex"></div>
  </div>
</div>

<div class="app" id="app" style="visibility:hidden">
  <div class="topbar">
    <div class="logo"><span class="mark">S</span> Sidelio <span class="sitename">Editing <b id="site-name">a site</b></span></div>
    <div class="top-mid" id="device">
      <button data-d="desktop" aria-pressed="true">🖥 Desktop</button>
      <button data-d="tablet" aria-pressed="false">▢ Tablet</button>
      <button data-d="mobile" aria-pressed="false">▯ Mobile</button>
    </div>
    <div class="top-right">
      <button class="btn-icon btn" id="cmdk-open" title="Command palette (⌘K)"><span class="kbd">⌘K</span></button>
      <button class="btn-icon btn" id="undo" title="Undo" disabled>↶</button>
      <button class="btn-icon btn" id="redo" title="Redo" disabled>↷</button>
      <button class="btn-icon btn" id="theme" title="Editor theme">◐</button>
      <button class="btn btn-primary" id="publish">Publish ↗</button>
    </div>
  </div>

  <div class="toolrail">
    <button id="tr-add" aria-pressed="false">＋<span class="tip">Add section</span></button>
    <button id="tr-ai">✦<span class="tip">Ask AI (⌘K)</span></button>
    <div class="sp"></div>
  </div>

  <main class="stage" id="stage"><div class="frame" id="frame"></div></main>

  <aside class="dock">
    <div class="dock-tabs">
      <button data-tab="assistant" aria-pressed="true">✦ Assistant</button>
      <button data-tab="edit" aria-pressed="false">✎ Edit</button>
    </div>
    <div class="dock-body" id="dock-body"></div>
  </aside>
</div>

<div class="cmdk" id="cmdk"><div class="cmdk-box">
  <input id="cmdk-input" placeholder="Ask AI or run a command…" autocomplete="off">
  <div class="cmdk-list" id="cmdk-list"></div>
</div></div>

<div class="toast" id="toast"><span class="ok">✓</span><span id="toast-msg"></span></div>

<script>
"use strict";
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const uid=(p='b')=>p+'_'+Math.random().toString(36).slice(2,8);

function artwork(design,seed,ratio=4/3){
  const w=800,h=Math.round(w/ratio),c=DESIGNS[design].c;
  let t=(seed*2654435761)>>>0;const rnd=()=>{t=(t+0x6d2b79f5)>>>0;let r=Math.imul(t^(t>>>15),1|t);r=(r+Math.imul(r^(r>>>7),61|r))^r;return((r^(r>>>14))>>>0)/4294967296;};
  const pal=[c.primary,c.accent,c.muted],pick=()=>pal[Math.floor(rnd()*pal.length)];
  let s=`<rect width='${w}' height='${h}' fill='${c.surface}'/><rect width='${w}' height='${h}' fill='${pick()}' opacity='0.09'/>`;
  for(let i=0;i<5;i++){const f=pick(),o=(0.15+rnd()*0.4).toFixed(2),k=Math.floor(rnd()*3);
    if(k===0)s+=`<circle cx='${rnd()*w|0}' cy='${rnd()*h|0}' r='${h*(0.25+rnd()*0.4)|0}' fill='${f}' opacity='${o}'/>`;
    else if(k===1)s+=`<rect x='${rnd()*w|0}' y='${rnd()*h|0}' width='${w*(0.3+rnd()*0.4)|0}' height='${h*(0.25+rnd()*0.5)|0}' fill='${f}' opacity='${o}'/>`;
    else{const x=rnd()*w|0,y=rnd()*h|0,z=h*(0.4+rnd()*0.4)|0;s+=`<path d='M${x} ${y} l${z} 0 l${-z/2|0} ${z} z' fill='${f}' opacity='${o}'/>`;}}
  return 'data:image/svg+xml,'+encodeURIComponent(`<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 ${w} ${h}'>${s}</svg>`);
}

const past=[],future=[];
const snap=()=>JSON.parse(JSON.stringify({design:site.design,name:site.name,pages:site.pages}));
function pushHist(){past.push(snap());if(past.length>80)past.shift();future.length=0;syncUndo();}
function commit(){pushHist();}
function undo(){if(!past.length)return;future.push(snap());const s=past.pop();Object.assign(site,s);selected=null;afterMutate(true);}
function redo(){if(!future.length)return;past.push(snap());const s=future.pop();Object.assign(site,s);selected=null;afterMutate(true);}
function syncUndo(){$('#undo').disabled=!past.length;$('#redo').disabled=!future.length;}

/* ---------------- The AI: interpret & apply ---------------- */
const DESIGN_WORDS=[[['bold','strong','striking','heavy','impactful'],'ironclad'],[['dark','premium','luxury','moody','upscale','elegant and dark'],'ember'],[['classic','traditional','trust','established','professional','elegant'],'harbour'],[['clean','minimal','simple','modern','fresh'],'seagrass'],[['corporate','serious','business','sharp'],'atlas'],[['playful','bright','fun','energetic','vibrant','colourful','colorful'],'signal'],[['natural','organic','earthy','warm','green'],'verdant']];
const COLOR_WORDS={blue:'#2563eb',navy:'#1f3a5f',teal:'#0f766e',green:'#4d7c0f',orange:'#c2410c',red:'#e11d48',pink:'#be185d',purple:'#6d28d9',black:'#111315',gold:'#b8860b'};
const SECTION_WORDS={testimonial:'testimonials',review:'testimonials',gallery:'gallery',portfolio:'gallery',photos:'gallery',pricing:'pricing',price:'pricing',plans:'pricing',faq:'faq',question:'faq',stat:'stats',numbers:'stats',team:'team',staff:'team',people:'team',contact:'contact',service:'services',feature:'services',cta:'cta','call to action':'cta','text and image':'text_image',story:'text_image',about:'text_image'};

function interpret(text){
  const t=' '+text.toLowerCase().trim()+' ';const ops=[];
  // generate a whole site
  if(/\b(build|make|create|start|generate|i (run|have|own)|we (run|are|do)|new site|for a|my business is)\b/.test(t)){
    let ind=null;for(const[k,v]of Object.entries(INDUSTRIES))if(v.match.some(m=>t.includes(m))){ind=k;break;}
    if(ind||/\b(build|generate|create).*(site|website)\b/.test(t)){ops.push({op:'generate',industry:ind,label:text.replace(/.*\b(for|a|an)\s+/i,'').replace(/\.$/,'')});}
  }
  // design change
  for(const[words,id]of DESIGN_WORDS)if(words.some(w=>t.includes(w))&&!ops.some(o=>o.op==='generate')){ops.push({op:'design',design:id});break;}
  if(/\b(dark mode|make it dark)\b/.test(t)&&!ops.some(o=>o.op==='design'))ops.push({op:'design',design:'ember'});
  // colour
  for(const[w,col]of Object.entries(COLOR_WORDS))if(new RegExp('\\b'+w+'\\b').test(t)){ops.push({op:'accent',color:col,word:w});break;}
  // add section
  const addM=t.match(/\b(add|insert|include|put in|create)\b[^.]*?\b(a|an|some)?\s*([a-z ]+?)\s*(section|block|page|bit)?\b/);
  if(/\b(add|insert|include|put in)\b/.test(t)){
    for(const[w,type]of Object.entries(SECTION_WORDS))if(t.includes(w)){ops.push({op:'add',type});break;}
  }
  // remove section
  if(/\b(remove|delete|drop|get rid of|take out)\b/.test(t)){
    for(const[w,type]of Object.entries(SECTION_WORDS))if(t.includes(w)){ops.push({op:'remove',type});break;}
  }
  // change headline
  const hm=text.match(/\b(headline|title|heading)\b[^"]*?["“](.+?)["”]/i)||text.match(/\b(headline|title|heading)\s+(?:to|say|reads?|:)\s+(.+)$/i);
  if(hm)ops.push({op:'headline',text:hm[2].trim()});
  return ops;
}
function applyOps(ops){
  const did=[];let touched=false;
  for(const op of ops){
    if(op.op==='generate'){
      const ind=op.industry?INDUSTRIES[op.industry]:null;
      site.design=ind?ind.design:'atlas';
      site.name=ind?ind.name:(op.label?titleCase(op.label):'your business');
      site.pages=[ind?makePage(ind.spec):makePage(genericSpec(site.name))];
      if(ind&&ind.accent)DESIGNS[site.design]=withAccent(site.design,ind.accent);
      site.page=0;selected=null;touched=true;
      did.push(`Drafted a home page — ${curBlocks().length} sections`);
      did.push(`Chose the ${DESIGNS[site.design].name} design`);
      $('#site-name').textContent=site.name;
    }else if(op.op==='design'){site.design=op.design;touched=true;did.push(`Switched to the ${DESIGNS[op.design].name} design`);}
    else if(op.op==='accent'){DESIGNS[site.design]=withAccent(site.design,op.color);touched=true;did.push(`Set the brand colour to ${op.word}`);}
    else if(op.op==='add'){const b=newBlock(op.type);b._new=true;curBlocks().push(b);selected=b.id;touched=true;did.push(`Added a ${BLOCK_META[op.type].label} section`);}
    else if(op.op==='remove'){const idx=curBlocks().findIndex(b=>b.type===op.type);if(idx>=0){curBlocks().splice(idx,1);touched=true;did.push(`Removed the ${BLOCK_META[op.type].label} section`);}}
    else if(op.op==='headline'){const h=curBlocks().find(b=>b.type==='hero');if(h){h.props.heading=op.text;touched=true;did.push(`Updated the headline`);}}
  }
  return {did,touched};
}
function withAccent(designId,color){return {...DESIGNS[designId],c:{...DESIGNS[designId].c,primary:color}};}
function titleCase(s){return s.replace(/\b\w/g,c=>c.toUpperCase());}

let aiBusy=false;
function sendAI(text){
  text=(text||'').trim();if(!text||aiBusy)return;
  const ta=$('#ai-input');if(ta){ta.value='';ta.style.height='auto';}
  chatLog.push({role:'me',text});
  const ops=interpret(text);
  chatLog.push({role:'typing'});renderChat();aiBusy=true;
  setTimeout(()=>{
    chatLog.pop(); // typing
    if(ops.length===0){
      chatLog.push({role:'ai',text:"I can change the design, the colours, the words, and add or remove sections. Try one of these:",did:[],chips:['Add a pricing section','Make it bolder','Add an FAQ','Change the colour to teal']});
      aiBusy=false;renderChat();return;
    }
    commit();
    const {did,touched}=applyOps(ops);
    if(!touched){chatLog.push({role:'ai',text:"I couldn’t find that on the page — it may already be gone.",did:[],chips:[]});aiBusy=false;renderChat();return;}
    const reply=composeReply(ops);
    chatLog.push({role:'ai',text:reply.text,did,chips:reply.chips});
    aiBusy=false;
    afterMutate(true);
    if(dockTab==='assistant')renderChat();
    toast(did[0]||'Done');
  },520);
}
function composeReply(ops){
  const k=ops.map(o=>o.op);
  if(k.includes('generate'))return {text:`Done — here's a starter site${site.name?` for ${site.name}`:''}. Everything is editable: click any text to rewrite it, or just tell me what to change.`,chips:['Add a booking section','Make it feel more premium','Add customer reviews','Change the colours']};
  const chips=['Add a gallery','Add an FAQ','Make it bolder','Add a contact section'].filter(c=>Math.random()<1).slice(0,3);
  return {text:pick(["Done.","There you go.","All set.","Updated.","Nice — that's in."]),chips};
}
function pick(a){return a[Math.floor(Math.random()*a.length)%a.length];}

/* ---------------- Mutations ---------------- */
function afterMutate(noHist){renderCanvas();if(dockTab==='edit')renderDock();syncUndo();}
function addBlockAt(type,index){commit();const b=newBlock(type);b._new=true;const at=index==null?curBlocks().length:index;curBlocks().splice(at,0,b);selected=b.id;renderCanvas();if(dockTab==='edit')renderDock();syncUndo();
  const el=$(`.sec[data-id="${b.id}"]`);el&&el.scrollIntoView({behavior:'smooth',block:'center'});toast(BLOCK_META[type].label+' added');}
function blockAct(id,act){const bs=curBlocks(),i=bs.findIndex(b=>b.id===id);if(i<0)return;
  if(act==='up'&&i>0){commit();[bs[i-1],bs[i]]=[bs[i],bs[i-1]];}
  else if(act==='down'&&i<bs.length-1){commit();[bs[i+1],bs[i]]=[bs[i],bs[i+1]];}
  else if(act==='dup'){commit();const c=JSON.parse(JSON.stringify(bs[i]));c.id=uid();c._new=true;bs.splice(i+1,0,c);selected=c.id;}
  else if(act==='del'){commit();bs.splice(i,1);if(selected===id)selected=null;}
  else return;
  renderCanvas();if(dockTab==='edit')renderDock();syncUndo();}
function moveBlock(id,toIndex){const bs=curBlocks(),i=bs.findIndex(b=>b.id===id);if(i<0||i===toIndex)return;commit();const[b]=bs.splice(i,1);bs.splice(i<toIndex?toIndex-1:toIndex,0,b);renderCanvas();syncUndo();}

function toast(msg){$('#toast-msg').textContent=msg;const t=$('#toast');t.classList.add('show');clearTimeout(toast._t);toast._t=setTimeout(()=>t.classList.remove('show'),2200);}

let dragId=null;
$('#frame').addEventListener('dragstart',e=>{const g=e.target.closest('[data-act="drag"]');if(!g){e.preventDefault();return;}const sec=e.target.closest('.sec');dragId=sec.dataset.id;sec.classList.add('dragging');e.dataTransfer.effectAllowed='move';});
$('#frame').addEventListener('dragover',e=>{if(!dragId)return;e.preventDefault();const sec=e.target.closest('.sec');$$('.sec',$('#frame')).forEach(s=>s.classList.remove('drop-before','drop-after'));if(sec&&sec.dataset.id!==dragId){const r=sec.getBoundingClientRect();sec.classList.add(e.clientY<r.top+r.height/2?'drop-before':'drop-after');}});
$('#frame').addEventListener('drop',e=>{if(!dragId)return;e.preventDefault();const sec=e.target.closest('.sec');if(sec&&sec.dataset.id!==dragId){const bs=curBlocks();let to=bs.findIndex(b=>b.id===sec.dataset.id);const r=sec.getBoundingClientRect();if(e.clientY>=r.top+r.height/2)to++;moveBlock(dragId,to);}dragId=null;});
$('#frame').addEventListener('dragend',()=>{dragId=null;$$('.sec',$('#frame')).forEach(s=>s.classList.remove('dragging','drop-before','drop-after'));});

/* dock inspector interactions */
$('#dock-body').addEventListener('input',e=>{const inp=e.target.closest('[data-in]');if(!inp)return;if(!inspBurst){pushHist();inspBurst=true;}clearTimeout(inspTimer);inspTimer=setTimeout(()=>inspBurst=false,500);setPath(inp.dataset.in,inp.value);const tw=$(`[data-edit][data-path="${CSS.escape(inp.dataset.in)}"]`,$('#frame'));if(tw&&tw.textContent!==inp.value)tw.textContent=inp.value;});
let inspBurst=false,inspTimer;
$('#dock-body').addEventListener('click',e=>{
  const dc=e.target.closest('[data-design]');if(dc){commit();site.design=dc.dataset.design;afterMutate(true);renderDock();toast('Design: '+DESIGNS[site.design].name);return;}
  const ac=e.target.closest('[data-accent]');if(ac){commit();DESIGNS[site.design]=withAccent(site.design,ac.dataset.accent);afterMutate(true);renderDock();toast('Brand colour updated');return;}
  const seg=e.target.closest('[data-seg] button');if(seg){const w=seg.closest('[data-seg]');let v=seg.dataset.v;if(v==='true'||v==='false')v=v==='true';else if(/^\d+$/.test(v))v=+v;commit();setPath(w.dataset.seg,v);afterMutate(true);renderDock();return;}
  const rm=e.target.closest('[data-rm]');if(rm){const b=curBlocks().find(x=>x.id===selected);const cfg=ITEM_FIELDS[b.type];commit();b.props[cfg.list].splice(+rm.dataset.rm,1);afterMutate(true);renderDock();return;}
  if(e.target.closest('[data-additem]')){const b=curBlocks().find(x=>x.id===selected);const cfg=ITEM_FIELDS[b.type];commit();b.props[cfg.list].push(JSON.parse(JSON.stringify(cfg.add)));afterMutate(true);renderDock();return;}
  if(e.target.closest('[data-deselect]')){selected=null;paintSel();renderDock();}
});

/* dock tabs */
function setTab(tab){dockTab=tab;$$('.dock-tabs button').forEach(b=>b.setAttribute('aria-pressed',b.dataset.tab===tab));renderDock();}
$$('.dock-tabs button').forEach(b=>b.addEventListener('click',()=>setTab(b.dataset.tab)));
$('#tr-ai').addEventListener('click',()=>{setTab('assistant');const ta=$('#ai-input');ta&&ta.focus();});
$('#tr-add').addEventListener('click',e=>openAddMenu(curBlocks().length,e.currentTarget));

/* add-section menu */
let menuEl=null;
function openAddMenu(index,anchor){
  closeMenu();const r=anchor.getBoundingClientRect();
  const cats={};for(const[t,m]of Object.entries(BLOCK_META))(cats[m.cat]=cats[m.cat]||[]).push([t,m]);
  menuEl=document.createElement('div');menuEl.className='menu';
  menuEl.innerHTML=Object.entries(cats).map(([cat,items])=>`<div class="mt">${cat}</div>`+items.map(([t,m])=>`<button data-pick="${t}"><span class="ic">${m.ic}</span>${m.label}</button>`).join('')).join('');
  document.body.appendChild(menuEl);
  const mw=210,mh=Math.min(menuEl.scrollHeight,320);
  let left=r.left, top=r.bottom+6;
  if(left+mw>innerWidth-10)left=innerWidth-mw-10;
  if(top+mh>innerHeight-10)top=r.top-mh-6;
  menuEl.style.left=Math.max(10,left)+'px';menuEl.style.top=Math.max(10,top)+'px';
  menuEl.addEventListener('click',ev=>{const p=ev.target.closest('[data-pick]');if(p){addBlockAt(p.dataset.pick,index);closeMenu();}});
}
function closeMenu(){if(menuEl){menuEl.remove();menuEl=null;}}
document.addEventListener('click',e=>{if(menuEl&&!menuEl.contains(e.target)&&!e.target.closest('[data-insert]')&&!e.target.closest('#tr-add'))closeMenu();});

/* device / topbar */
$('#device').addEventListener('click',e=>{const b=e.target.closest('[data-d]');if(!b)return;device=b.dataset.d;$$('#device button').forEach(x=>x.setAttribute('aria-pressed',x===b));renderCanvas();});
$('#undo').addEventListener('click',undo);$('#redo').addEventListener('click',redo);
$('#theme').addEventListener('click',()=>{const r=document.documentElement,cur=r.getAttribute('data-theme'),sys=matchMedia('(prefers-color-scheme:dark)').matches;r.setAttribute('data-theme',cur?(cur==='dark'?'light':'dark'):(sys?'light':'dark'));});
$('#publish').addEventListener('click',()=>{const slug=(site.name||'site').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');toast(`Published — ${slug}.sidelio.site`);});

/* command palette */
const CMDS=[
  {t:'Ask the assistant',s:'AI',ic:'✦',run:()=>{setTab('assistant');setTimeout(()=>$('#ai-input')?.focus(),50);}},
  {t:'Add a section',s:'Insert',ic:'＋',run:()=>openAddMenu(curBlocks().length,$('#tr-add'))},
  ...Object.entries(DESIGNS).map(([id,d])=>({t:'Design: '+d.name,s:d.tag,ic:'◨',run:()=>{commit();site.design=id;afterMutate(true);renderDock();toast('Design: '+d.name);}})),
  {t:'Preview mobile',s:'Device',ic:'▯',run:()=>{device='mobile';$$('#device button').forEach(x=>x.setAttribute('aria-pressed',x.dataset.d==='mobile'));renderCanvas();}},
  {t:'Publish site',s:'',ic:'↗',run:()=>$('#publish').click()},
];
let cmdSel=0,cmdFiltered=CMDS;
function openCmdk(){$('#cmdk').classList.add('open');const i=$('#cmdk-input');i.value='';filterCmd('');setTimeout(()=>i.focus(),30);}
function closeCmdk(){$('#cmdk').classList.remove('open');}
function filterCmd(q){q=q.toLowerCase();cmdFiltered=CMDS.filter(c=>c.t.toLowerCase().includes(q)||c.s.toLowerCase().includes(q));cmdSel=0;
  $('#cmdk-list').innerHTML=cmdFiltered.map((c,i)=>`<button class="${i===0?'on':''}" data-i="${i}"><span class="ic">${c.ic}</span>${esc(c.t)}<span class="sub">${esc(c.s)}</span></button>`).join('')||`<div style="padding:14px;color:var(--faint);font-size:13px">Press Enter to ask the assistant “${esc(q)}”</div>`;}
$('#cmdk-input').addEventListener('input',e=>filterCmd(e.target.value));
$('#cmdk-input').addEventListener('keydown',e=>{
  if(e.key==='Escape')closeCmdk();
  else if(e.key==='ArrowDown'){e.preventDefault();cmdSel=Math.min(cmdSel+1,cmdFiltered.length-1);hiCmd();}
  else if(e.key==='ArrowUp'){e.preventDefault();cmdSel=Math.max(cmdSel-1,0);hiCmd();}
  else if(e.key==='Enter'){const q=e.target.value.trim();if(cmdFiltered.length){cmdFiltered[cmdSel].run();closeCmdk();}else if(q){closeCmdk();setTab('assistant');sendAI(q);}}
});
function hiCmd(){$$('#cmdk-list button').forEach((b,i)=>b.classList.toggle('on',i===cmdSel));}
$('#cmdk-list').addEventListener('click',e=>{const b=e.target.closest('[data-i]');if(b){cmdFiltered[+b.dataset.i].run();closeCmdk();}});
$('#cmdk').addEventListener('click',e=>{if(e.target.id==='cmdk')closeCmdk();});
$('#cmdk-open').addEventListener('click',openCmdk);
document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();openCmdk();}
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='z'&&!e.shiftKey){if(document.activeElement?.hasAttribute?.('data-edit'))return;e.preventDefault();undo();}
  else if((e.metaKey||e.ctrlKey)&&(e.key.toLowerCase()==='y'||(e.shiftKey&&e.key.toLowerCase()==='z'))){e.preventDefault();redo();}
});

/* ---------------- Onboarding ---------------- */
const EXAMPLES=['A family roofing company','A neighbourhood bakery & café','A law firm','A hair salon','A wedding photographer','A strength & fitness studio'];
$('#onb-ex').innerHTML=EXAMPLES.map(x=>`<button class="chip" data-ex="${esc(x)}">${esc(x)}</button>`).join('');
$('#onb-ex').addEventListener('click',e=>{const c=e.target.closest('[data-ex]');if(c){$('#onb-input').value=c.dataset.ex;startBuild(c.dataset.ex);}});
$('#onb-go').addEventListener('click',()=>startBuild($('#onb-input').value));
$('#onb-input').addEventListener('keydown',e=>{if(e.key==='Enter'&&(e.metaKey||e.ctrlKey||!e.shiftKey)){e.preventDefault();startBuild($('#onb-input').value);}});

function startBuild(text){
  text=(text||'').trim();if(!text)text='A small local business';
  let ind=null;for(const[k,v]of Object.entries(INDUSTRIES))if(v.match.some(m=>text.toLowerCase().includes(m))){ind=k;break;}
  const inner=$('#onb-inner');
  const steps=['Reading your description…','Drafting the copy…',`Choosing a design…`,'Laying out sections…','Polishing…'];
  inner.innerHTML=`<div class="logo"><span class="mark">S</span> Sidelio Studio</div><div class="build-anim"><div style="font-size:17px;color:var(--ink);font-weight:600;margin-bottom:4px">Building your site</div><div class="build-steps" id="bs">${steps[0]}</div><div class="bar"><i id="bar"></i></div></div>`;
  let i=0;const tick=()=>{const pct=Math.round(((i+1)/steps.length)*100);$('#bar').style.width=pct+'%';$('#bs').textContent=steps[i];i++;if(i<steps.length)setTimeout(tick,340);else setTimeout(finishBuild,420);};
  tick();
  window.__genInd=ind;window.__genText=text;
}
function finishBuild(){
  const ind=window.__genInd,text=window.__genText;
  const {} = applyOps([{op:'generate',industry:ind,label:text.replace(/^(a|an)\s+/i,'')}]);
  $('#app').style.visibility='visible';
  const onb=$('#onb');onb.classList.add('gone');setTimeout(()=>onb.style.display='none',420);
  renderCanvas();setTab('assistant');syncUndo();
  chatLog.length=0;
  aiSay(`I've drafted a starter site${site.name&&site.name!=='your business'?` for ${site.name}`:''} — ${curBlocks().length} sections in the ${DESIGNS[site.design].name} design. Click any text on the page to rewrite it, or just tell me what to change.`,[],['Add a booking section','Make it feel more premium','Add customer reviews','Add a pricing section']);
  past.length=0;future.length=0;syncUndo();
}

/* boot: seed a default so the editor isn't empty if skipped */
site.pages=[makePage(INDUSTRIES.roofing.spec)];site.design='harbour';site.name='Acme Roofing';
</script>
